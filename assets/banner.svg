<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Neon Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .pulse-glow {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .bracket-flow {
        stroke-dasharray: 10, 15;
        animation: flow 20s linear infinite;
      }
      .trophy-float {
        animation: float 4s ease-in-out infinite alternate;
      }
      .badge-shimmer {
        animation: shimmer 4s ease-in-out infinite alternate;
      }
      .title-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: 2px;
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1.02); }
      }
      @keyframes flow {
        from { stroke-dashoffset: 500; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes shimmer {
        0% { opacity: 0.7; filter: drop-shadow(0 0 2px #00f2fe); }
        100% { opacity: 1; filter: drop-shadow(0 0 12px #ff0080); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Cyber Grid Background -->
  <g opacity="0.12" stroke="#4facfe" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="100" r="160" fill="url(#neonPurple)" opacity="0.25" filter="url(#glowPurple)" class="pulse-glow" />
  <circle cx="1020" cy="320" r="180" fill="url(#neonCyan)" opacity="0.2" filter="url(#glowCyan)" class="pulse-glow" />

  <!-- Left Side: Animated Bracket Diagram Illustration -->
  <g opacity="0.65" stroke-width="2" class="bracket-flow">
    <!-- Round 1 to Round 2 -->
    <path d="M 50 100 L 90 100 L 90 140 L 130 140" fill="none" stroke="url(#neonCyan)" />
    <path d="M 50 180 L 90 180 L 90 140" fill="none" stroke="url(#neonCyan)" />
    <path d="M 50 260 L 90 260 L 90 300 L 130 300" fill="none" stroke="url(#neonPurple)" />
    <path d="M 50 340 L 90 340 L 90 300" fill="none" stroke="url(#neonPurple)" />

    <!-- Round 2 to Finals -->
    <path d="M 130 140 L 170 140 L 170 220 L 210 220" fill="none" stroke="url(#neonMagenta)" />
    <path d="M 130 300 L 170 300 L 170 220" fill="none" stroke="url(#neonMagenta)" />
  </g>

  <!-- Bracket Nodes (Pills) -->
  <g opacity="0.75">
    <rect x="35" y="90" width="30" height="20" rx="4" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
    <rect x="35" y="170" width="30" height="20" rx="4" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
    <rect x="35" y="250" width="30" height="20" rx="4" fill="#1e293b" stroke="#7928ca" stroke-width="1.5" />
    <rect x="35" y="330" width="30" height="20" rx="4" fill="#1e293b" stroke="#7928ca" stroke-width="1.5" />
    <rect x="115" y="130" width="30" height="20" rx="4" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
    <rect x="115" y="290" width="30" height="20" rx="4" fill="#1e293b" stroke="#ff0080" stroke-width="1.5" />
    <rect x="195" y="210" width="30" height="20" rx="4" fill="#1e293b" stroke="#ff0844" stroke-width="2" />
  </g>

  <!-- Right Side: Floating Esports Trophy & Controller Icon -->
  <g transform="translate(940, 110)" class="trophy-float">
    <!-- Trophy Glow -->
    <circle cx="90" cy="90" r="90" fill="url(#goldGrad)" opacity="0.15" filter="url(#glowPurple)" />
    <!-- Trophy Base & Cup -->
    <path d="M 50 50 L 130 50 L 120 110 C 115 140 65 140 60 110 Z" fill="url(#goldGrad)" />
    <path d="M 40 60 C 20 60 20 95 53 95" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M 140 60 C 160 60 160 95 127 95" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <!-- Stem & Pedestal -->
    <rect x="83" y="130" width="14" height="25" fill="url(#goldGrad)" rx="2" />
    <polygon points="60,155 120,155 128,175 52,175" fill="#f59e0b" />
    <rect x="46" y="175" width="88" height="14" fill="#d97706" rx="3" />
    <!-- Star on Trophy -->
    <polygon points="90,70 94,80 105,80 96,87 99,98 90,92 81,98 84,87 75,80 86,80" fill="#ffffff" />

    <!-- Game Controller Accents -->
    <g transform="translate(10, 130)" opacity="0.85">
      <rect x="70" y="50" width="60" height="34" rx="12" fill="#0f172a" stroke="#00f2fe" stroke-width="2" />
      <circle cx="85" cy="67" r="4" fill="#00f2fe" />
      <circle cx="115" cy="67" r="3" fill="#ff0080" />
      <line x1="85" y1="62" x2="85" y2="72" stroke="#00f2fe" stroke-width="2" />
      <line x1="80" y1="67" x2="90" y2="67" stroke="#00f2fe" stroke-width="2" />
    </g>
  </g>

  <!-- Central Typography & Branding -->
  <!-- Top Category Tag -->
  <g transform="translate(360, 80)">
    <rect x="0" y="0" width="480" height="34" rx="17" fill="#1e293b" stroke="url(#neonPurple)" stroke-width="1.5" class="badge-shimmer" />
    <text x="240" y="22" fill="#38bdf8" text-anchor="middle" font-size="12" class="subtitle-text" font-weight="700">
      ⚡ THE DEFINITIVE ESPORTS COMPETITIVE ECOSYSTEM
    </text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="170" text-anchor="middle" fill="#ffffff" font-size="46" class="title-text">
    Awesome Esports Tournament
  </text>
  <text x="600" y="225" text-anchor="middle" fill="url(#neonCyan)" font-size="46" class="title-text" filter="url(#glowCyan)">
    Management Platforms
  </text>

  <!-- Subtitle -->
  <text x="600" y="280" text-anchor="middle" fill="#94a3b8" font-size="16" class="subtitle-text">
    BRACKETS • LEAGUES • SEEDING • REGISTRATION • OPEN-SOURCE &amp; SAAS
  </text>

  <!-- Feature Highlights Chips -->
  <g transform="translate(300, 325)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#131e36" stroke="#00f2fe" stroke-width="1" opacity="0.9" />
      <text x="90" y="23" text-anchor="middle" fill="#e0f2fe" font-size="13" font-family="'Inter', sans-serif" font-weight="600">🏆 SaaS Category Giants</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="200" height="36" rx="8" fill="#1f1538" stroke="#a855f7" stroke-width="1" opacity="0.9" />
      <text x="100" y="23" text-anchor="middle" fill="#f3e8ff" font-size="13" font-family="'Inter', sans-serif" font-weight="600">⚡ Self-Hosted &amp; Libraries</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#2d1326" stroke="#f43f5e" stroke-width="1" opacity="0.9" />
      <text x="90" y="23" text-anchor="middle" fill="#ffe4e6" font-size="13" font-family="'Inter', sans-serif" font-weight="600">🎯 Verified Pricing Data</text>
    </g>
  </g>
</svg>
